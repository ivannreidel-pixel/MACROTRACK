<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MacroTracker Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Enlace al manifiesto de Android -->
  <link rel="manifest" href="manifest.json">

  <!-- Metadatos de interfaz -->
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MacroTracker">

  <!-- Nuevos iconos PNG -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
      --bg: #090d16;
      --card: #131c2e;
      --border: #223049;
      --text: #f1f5f9;
      --muted: #8899b5;
      --accent: #10b981;
      --carb: #38bdf8;
      --prot: #f43f5e;
      --fat: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; padding-bottom: 70px; }
    .container { max-width: 520px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .online-indicator { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; display: inline-block; box-shadow: 0 0 6px var(--accent); }
    .date-badge { font-size: 0.75rem; background: var(--border); padding: 4px 8px; border-radius: 6px; color: var(--muted); }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; color: #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; display: block; }
    select, input { width: 100%; background: #090d16; border: 1px solid var(--border); border-radius: 8px; color: #fff; padding: 8px 10px; font-size: 0.85rem; outline: none; }
    select:focus, input:focus { border-color: var(--accent); }
    
    .progress-container { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .progress-bar-wrap { width: 100%; background: #090d16; height: 7px; border-radius: 4px; overflow: hidden; margin-top: 3px; }
    .progress-bar { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .macro-meta { display: flex; justify-content: space-between; font-size: 0.75rem; }

    .food-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    .food-row input[type="text"] { flex: 2; }
    .food-row input[type="number"] { flex: 1; }
    .btn-remove { background: #1c273c; border: none; color: #f87171; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1rem; }

    .btn { display: block; width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; text-align: center; }
    .btn-outline { background: transparent; border: 1px dashed var(--muted); color: var(--muted); margin-bottom: 8px; }
    .btn-primary { background: var(--accent); color: #022c22; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-msg { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 6px; min-height: 16px; }

    .meals-list { margin-top: 8px; max-height: 240px; overflow-y: auto; }
    .meal-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    .meal-item:last-child { border-bottom: none; }
    .meal-desc { display: flex; flex-direction: column; }
    .meal-name { font-weight: 600; color: #fff; }
    .meal-sub { font-size: 0.7rem; color: var(--muted); }
    .meal-source { font-size: 0.65rem; color: #64748b; }
    .meal-del { background: transparent; border: none; color: #ef4444; font-size: 0.95rem; cursor: pointer; padding: 4px 6px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1><span class="online-indicator"></span> MacroTracker</h1>
    <span class="date-badge" id="current-date-label"></span>
  </header>

  <div class="card">
    <div class="card-title">Objetivo Nutricional</div>
    <div class="grid-2">
      <div>
        <label>Estrategia</label>
        <select id="goal-select" onchange="updateTargets()">
          <option value="mantenimiento">Mantenimiento (40C / 30P / 30G)</option>
          <option value="definicion">Definición (30C / 40P / 30G)</option>
          <option value="volumen">Volumen (50C / 25P / 25G)</option>
          <option value="lowcarb">Low Carb (15C / 35P / 50G)</option>
        </select>
      </div>
      <div>
        <label>Calorías Diarias</label>
        <input type="number" id="calories-goal" value="2000" step="50" onchange="updateTargets()">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Progreso de Hoy</span>
      <span id="cal-count" style="color: var(--accent); font-weight: 700;">0 / 2000 kcal</span>
    </div>
    <div class="progress-container">
      <div>
        <div class="macro-meta">
          <span style="color: var(--prot);">Proteína</span>
          <span id="p-count">0 / 150g</span>
        </div>
        <div class="progress-bar-wrap"><div id="p-bar" class="progress-bar" style="background: var(--prot); width: 0%;"></div></div>
      </div>
      <div>
        <div class="macro-meta">
          <span style="color: var(--carb);">Carbohidratos</span>
          <span id="c-count">0 / 200g</span>
        </div>
        <div class="progress-bar-wrap"><div id="c-bar" class="progress-bar" style="background: var(--carb); width: 0%;"></div></div>
      </div>
      <div>
        <div class="macro-meta">
          <span style="color: var(--fat);">Grasas</span>
          <span id="f-count">0 / 67g</span>
        </div>
        <div class="progress-bar-wrap"><div id="f-bar" class="progress-bar" style="background: var(--fat); width: 0%;"></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Registrar Alimentos</div>
    <div id="inputs-container">
      <div class="food-row">
        <input type="text" placeholder="Ej: Pollo, Arroz yamani, Queso..." class="food-name" onkeydown="handleKey(event)">
        <input type="number" placeholder="Gramos" class="food-grams" onkeydown="handleKey(event)">
        <button class="btn-remove" onclick="removeRow(this)">×</button>
      </div>
    </div>
    <button class="btn btn-outline" onclick="addRow()">+ Agregar otro casillero</button>
    <button class="btn btn-primary" id="btn-submit" onclick="processMeals()">Buscar y Registrar</button>
    <div class="status-msg" id="status-msg"></div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Consumido Hoy</span>
      <button onclick="clearToday()" style="background:none; border:none; color:var(--muted); font-size:0.75rem; cursor:pointer;">Reiniciar día</button>
    </div>
    <div class="meals-list" id="meals-list">
      <div style="color: var(--muted); font-size: 0.75rem; text-align: center; padding: 12px;">Sin registros hoy.</div>
    </div>
  </div>
</div>
